# run03 F-2 -- fusion ablation re-derived from the nested-CV checkpoints.
#
# This is a SENSITIVITY ANALYSIS, not a replacement. It answers one question the
# headline table cannot: how much of the fusion result depends on a CNN branch
# whose checkpoint was selected on the very fold it is scored against.
#
# Two things differ from configs/config.yaml and nothing else does:
#   1. paths.results -> artifacts/results/run03, so nothing overwrites the
#      published ablation_summary.csv or delong_fusion.csv.
#   2. track1_fusion.cnn_ckpt_subdir points each backbone at its run03 100%
#      cell. That cell is the F-1 winner on inner-val for all three backbones
#      (artifacts/results/run03/f1_summary.md); no candidate variant beat it, so
#      fine-tuning is not adopted and this is the honest-protocol counterpart of
#      the published recipe rather than a new configuration.
#
# The backbone list is the three Track 1 models run03 retrained. The other four
# Track 1 backbones have no run03 checkpoint and are deliberately absent; their
# published rows stay as they are.

seed: 42
force_rerun: true

paths:
  raw: "./data/raw/LIDC-IDRI"
  interim: "./artifacts/patches"
  features: "./artifacts/features/radiomics.parquet"
  splits: "./artifacts/splits/folds.json"
  checkpoints: "./artifacts/checkpoints"
  logs: "./artifacts/logs"
  results: "./artifacts/results/run03"

data:
  n_slices: 3
  patch_xy: 64
  n_folds: 5
  include_indeterminate: true
  skip_existing: true
  freeze_from: "data/processed/labels_binary_v1.csv"

train:
  epochs: 50
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 10
  checkpoint_every: 5
  mixed_precision: true

models:
  lightweight: ["mobilenetv3_small", "efficientnet_b0", "densenet121"]
  heavyweight: ["resnet50", "vgg16", "vit_base"]

tracks:
  track2:
    backbones: ["mobilenetv2", "efficientnet_b0", "resnet50", "vgg16"]
    input_size: null
  track1:
    backbones: ["convnext_tiny", "densenet201", "densenet121"]
    input_size: 96

track1_fusion:
  enabled: true
  backbone: "convnext_tiny"
  fusion_arms: ["concat"]
  branch_norm_proj_dim: 32
  modality_dropout_rate: 0.0
  aux_loss_weight: 0.0
  # F-1 winner per backbone, chosen on inner-val. Read by
  # src/stage_03b_fusion._cnn_ckpt_subdir; absent from the default config, where
  # it falls back to `{model}` and reproduces the published path exactly.
  cnn_ckpt_subdir:
    convnext_tiny: "run03/convnext_tiny_uf100"
    densenet201: "run03/densenet201_uf100"
    densenet121: "run03/densenet121_uf100"

xgboost: {}

radiomics:
  params_yaml: "configs/radiomics_params.yaml"
  incremental: true
