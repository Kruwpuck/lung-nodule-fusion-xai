# CORRECTED 2026-10-26: the collaborator copy lacked `run_id` and `track1_fusion.save_persample`, so the patched stage_03b would
# have written neither the provenance columns nor the per-case probabilities. Everything else is unchanged.
#
# rerun_seeded P0-3 -- recompute Tabel I dengan radiomics ter-seed.
#
# Tujuannya satu: mereproduksi Tabel I di bawah rezim seed yang sudah ditutup
# commit 733856b, supaya ketujuh baris `radiomics_only` identik alih-alih
# tersebar 0.9301..0.9343. Sebaran itu derau seleksi fitur tak ter-seed, bukan
# efek backbone -- arm itu nol menyentuh CNN.
#
# Dua nilai berbeda dari configs/config.yaml dan nol lain:
#   1. paths.results   -> artifacts/results/rerun_seeded, supaya nol menimpa
#      artifacts/results/fusion/ablation_summary.csv (175 baris) maupun
#      delong_fusion.csv yang sudah terbit dan dipakai naskah.
#   2. paths.checkpoints -> artifacts/checkpoints_rerun, supaya checkpoint fusi
#      baru nol menimpa artifacts/checkpoints/{model}_fusion_intermediate/.
#
# PERINGATAN, run gagal senyap kalau ini dilewat. artifacts/checkpoints_rerun
# WAJIB sudah berisi junction ke 7 backbone sebelum run:
#
#   cd /d "<repo>\artifacts"
#   mkdir checkpoints_rerun
#   for %M in (convnext_tiny densenet121 densenet201 googlenet inception_resnet_v2 inceptionv3 xception) do mklink /J "checkpoints_rerun\%M" "checkpoints\%M"
#
# Sebabnya: stage_03b_fusion.py:239 MENULIS checkpoint fusi lewat
# paths.checkpoints, sementara :315 MEMBACA checkpoint CNN-only lewat
# paths.checkpoints yang sama dan men-skip (logger.warning + continue) backbone
# yang checkpointnya hilang. Folder bersih tanpa junction = nol backbone jalan =
# CSV kosong, tanpa satu pun error. `track1_fusion.cnn_ckpt_subdir` nol bisa
# menolong di sini: dia cuma mengarahkan jalur baca, dan tetap relatif ke
# paths.checkpoints yang sama.
#
# Blok lain dipertahankan apa adanya dengan sengaja: seed 42, 7 backbone
# tracks.track1, fusion_arms ["concat"], modality_dropout_rate 0.0,
# aux_loss_weight 0.0. Kalau arm atau regularizer bergeser, yang dihasilkan
# bukan lagi reproduksi Tabel I melainkan konfigurasi baru.
#
# Batas yang diketahui: stage_03b_fusion.py nol menyemai apa pun -- fix_seed()
# cuma dipanggil stage_03_train.py:147 dan stage_10b_finetune.py:221, dan
# satu-satunya random_state di stage_03b adalah GroupShuffleSplit(random_state=fold)
# pada :200. Jadi arm fusion_intermediate nol akan bit-exact antar run. Uji
# terimanya karena itu dipasang pada arm radiomics_only, yang memang determinis
# di bawah seed: 7 baris wajib cocok 0.93255 +- 0.01559, pooled 0.93195, sampai
# digit terakhir. Meleset = seed bukan satu-satunya sumber nondeterminisme dan
# rerun batal.
#
# Loader-nya yaml.safe_load polos (stage_03b_fusion.py:458), nol merge default,
# jadi berkas ini salinan penuh -- sama seperti configs/config_run03.yaml.

seed: 42
force_rerun: true
run_id: "2026-10-p03-seeded-ablation"   # REQUIRED: without it _provenance() returns {} and no provenance columns are written

paths:
  raw: "./data/raw/LIDC-IDRI"
  interim: "./artifacts/patches"
  features: "./artifacts/features/radiomics.parquet"
  splits: "./artifacts/splits/folds.json"
  checkpoints: "./artifacts/checkpoints_rerun"
  logs: "./artifacts/logs"
  results: "./artifacts/results/rerun_seeded"

data:
  n_slices: 3
  patch_xy: 64
  n_folds: 5
  include_indeterminate: true   # keep median==3 nodules (label=-1), don't discard
  skip_existing: true           # don't re-crop the ~1391 nodules already extracted
  freeze_from: "data/processed/labels_binary_v1.csv"  # keep old patient folds stable

train:
  epochs: 50
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 10
  checkpoint_every: 5
  mixed_precision: true

models:            # legacy: set 6-backbone di balik 120 checkpoint existing
  lightweight: ["mobilenetv3_small", "efficientnet_b0", "densenet121"]
  heavyweight: ["resnet50", "vgg16", "vit_base"]

tracks:
  track2:          # model comparison + hyperparameter/stability study
    backbones: ["mobilenetv2", "efficientnet_b0", "resnet50", "vgg16"]
    input_size: null          # semua native 64x64, tanpa upsample
  track1:          # fusion radiomics-CNN + xAI per-arm
    backbones: ["densenet121", "inceptionv3", "xception", "googlenet",
                "convnext_tiny", "inception_resnet_v2", "densenet201"]
    input_size: 96             # seragam lintas arm; >= 75 (floor InceptionV3/IRv2)

track2_sweep:
  enabled: true
  optimizers: ["sgd", "adam", "adamw"]
  weight_decays:               # default PyTorch per-optimizer +/- 1 order of magnitude
    sgd:   [1.0e-5, 1.0e-4, 1.0e-3]
    adam:  [1.0e-5, 1.0e-4, 1.0e-3]
    adamw: [1.0e-3, 1.0e-2, 1.0e-1]
  momentum: 0.9                # untuk SGD+momentum
  # Rev1 task 7: SGD run at lr=1e-4 (same as Adam) showed up to 0.1457 AUC gap
  # vs Adam. Literature says SGD typically needs ~10-100x Adam's lr, so test
  # whether the gap is a tuning artifact. Run at cfg's default weight_decay;
  # isolated from the wd-sweep combos above via the `_lr{lr:g}` run_id suffix.
  sgd_lr_sweep: [1.0e-3, 1.0e-2, 1.0e-1]

track1_fusion:
  enabled: true
  backbone: "mobilenetv3_small"
  # Rev1 task 5a: additional FusionNet arms to train alongside the default
  # "concat" arm (unchanged legacy behavior). Add "branch_norm" to also run
  # the per-branch L2-normalized / down-projected CNN embedding arm.
  fusion_arms: ["concat"]
  save_persample: true   # REQUIRED: without it no fusion/persample_{backbone}.csv is written (needs the patched stage_03b_fusion.py)
  branch_norm_proj_dim: 32
  # Rev1 task 5c: modality dropout + auxiliary per-branch losses. Regularizers,
  # not a fusion topology, so they compose with any arm above rather than
  # adding a 4th arm name. Both default to 0.0 (no-op) so the default config
  # path reproduces today's numbers unchanged.
  modality_dropout_rate: 0.0
  aux_loss_weight: 0.0

radiomics:
  params_yaml: "configs/radiomics_params.yaml"
  incremental: true   # only extract features for nodules not already in the cache
